name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: llvm-tools-preview

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@eba66cc6f87204a1e73f96e528e759b6c1fcf573 # cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: lcov.info
          fail_ci_if_error: false

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Run Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Check fuzz workspace
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  security:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RUSTC_WRAPPER: ""

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@f1d783a3a0ed7012c43e2889fbe3519390e9025b # cargo-deny
        with:
          tool: cargo-deny

      - name: Run cargo deny
        run: cargo deny check
        env:
          RUSTC_WRAPPER: ""

  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Build
        run: cargo build --release

      - name: Generate TLS certificates
        run: bash example/gen-certs.sh

      - name: Start proxy
        run: |
          cd example
          ../target/release/gatekeeper --config gatekeeper.toml &
          echo $! > /tmp/gatekeeper.pid
          # Wait for the proxy to finish binding with a retry loop
          for i in $(seq 1 30); do
            if curl -sf --max-time 1 http://127.0.0.1:3128/proxy.pac -o /dev/null 2>/dev/null; then
              break
            fi
            sleep 0.1
          done

      - name: Test HTTPS via proxy to google.com
        run: |
          cd example
          curl -v \
            --max-time 30 \
            --proxy https://127.0.0.1:3128 \
            --proxy-cacert certs/ca.crt \
            --proxy-cert certs/client.crt \
            --proxy-key certs/client.key \
            https://www.google.com \
            -o /dev/null

      - name: Test PAC endpoint responds with 200
        run: |
          curl -sv --max-time 10 http://127.0.0.1:3128/proxy.pac -o /dev/null

      - name: Test denied domain returns 403
        run: |
          cd example
          # evil.example.com is not in the allowlist — expect 403
          # Using %{http_connect} because %{http_code} is 000 when CONNECT tunnel fails
          response=$(curl -v -s -o /dev/null -w "%{http_connect}" \
            --max-time 10 \
            --proxy https://127.0.0.1:3128 \
            --proxy-cacert certs/ca.crt \
            --proxy-cert certs/client.crt \
            --proxy-key certs/client.key \
            https://evil.example.com/ || true)
          test "$response" = "403" || (echo "Expected 403 for denied domain, got $response" && exit 1)

      - name: Test plaintext non-PAC request returns 403
        run: |
          # Non-PAC path over plaintext should be rejected
          response=$(curl -sv -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            http://127.0.0.1:3128/not-pac || true)
          test "$response" = "403" || (echo "Expected 403 for non-PAC plaintext request, got $response" && exit 1)

      - name: Stop proxy
        if: always()
        run: kill "$(cat /tmp/gatekeeper.pid)" 2>/dev/null || true

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - allowlist
          - connect_authority
          - domain_validation
          - pac_generation
          - escape_js
          - der_cn
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-gnu

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@82fc405565b9cf90abfe700ba43b4751ce2fe422 # cargo-fuzz
        with:
          tool: cargo-fuzz

      - name: Run fuzz target
        run: cargo +nightly fuzz run "${{ matrix.target }}" --target x86_64-unknown-linux-gnu -- -max_total_time=30
